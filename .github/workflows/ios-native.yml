# 새 아이폰 앱(Expo) 굽기 — GitHub 의 맥에서 native/ 를 아이폰 앱으로 만들어 TestFlight 에 올린다.
#
# 옛 앱(mobile/)의 ios.yml 을 본떴다. 다른 점 셋:
#
# ■ main 에 올리면 새 앱에 저절로 들어간다(2026-10-20 김민: "모든 세션 · 금윤호의 푸시가 네이티브 앱에, 웹앱처럼 바로")
#
# 새 앱이 정식 '불펜로그'(com.bullpenlog.app)다. 앱에 드는 코드(native/ · 앱이 같이 쓰는 lib/)가 바뀐 main 푸시마다 —
#   1. plan    바닥 판(runtimeVersion = 지문, app.json policy fingerprint)을 셈하고 그 판 앱을 구운 적 있는지 사이트에 묻는다
#   2. publish 화면 코드를 내보내 업데이트로 올린다(3~5분, Supabase 공개 버킷 app-updates) — 그 바닥 판 앱은 다시 켤 때 받는다(/api/app-update)
#   3. build   바닥 판이 새것일 때만(스위프트 · 네이티브 패키지 · 설정이 바뀜) 굽고 TestFlight 에 올린 뒤 '구웠음'을 적는다
#   업데이트 올리기는 앱 업데이트 전용 열쇠(APP_UPDATE_TOKEN, 없으면 LIBRARY_BUNDLE_TOKEN)로 사이트 /api/app-update/publish 를 부른다 — 저장소 열쇠는 GitHub 에 없다
# 잇따라 올리면 plan · publish 는 앞 것을 멈추고 마지막 것만, build(30~50분)는 멈추지 않고 앞 굽기가 끝난 뒤 차례로(잡마다 concurrency).
# 푸시로 돌 때는 시뮬레이터 확인은 건너뛴다(35분 아낌).
# 손으로 돌릴 때(Run workflow)는 늘 굽고, '올리기' 스위치를 켠 실행만 TestFlight 에 올린다. 웹만 바꾼 푸시는 Vercel 배포로 끝.
#
# ■ ios/ 폴더는 저장소에 없다 — 매번 expo prebuild 로 만든다
#
# Expo 는 ios/ · android/ 를 app.json 에서 만들어 낸다(native/.gitignore 가 둘을 뺀다). 그래서 굽기 전에
# `expo prebuild -p ios` → `pod install` 을 먼저 돈다. Xcode 워크스페이스는 ios/BullpenLog.xcworkspace, 스킴은 BullpenLog.
#
# ■ 빌드 번호는 Info.plist 에 직접 쓴다
#
# prebuild 가 만든 Info.plist 는 CFBundleVersion 을 글자 그대로 '1' 로 둔다(빌드 설정을 참조하지 않는다). 그래서
# xcodebuild 의 CURRENT_PROJECT_VERSION 만으로는 안 바뀌고, PlistBuddy 로 Info.plist 도 같이 고친다. 번호는 옛 앱과
# 같은 모양(시각, 20261019.123045)이라 옛 앱 판(20261016.xxxxx)보다 늘 크다 — 같은 번들 ID 라 작으면 애플이 거절한다.
#
# ■ 서명은 굽는 단계가 아니라 내보내는(export) 단계에서만 한다 — 까닭은 ios.yml 머리 주석
#
# ■ 열쇠 — ios.yml 과 같은 넷(ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8 · APPLE_TEAM_ID), 설정 순서는 mobile/APPLE-SETUP.md
#
# ■ 운동 · 드릴 영상(720p HEVC)을 앱 안에 — prebuild 전에 native/LibraryVideos 로 받고(LIBRARY_BUNDLE_TOKEN), prebuild 의
#   plugins/library-videos 가 Xcode 에 폴더 참조로 싣는다(2026-10-20 김민: "앱 안에 넣을 거야"). 못 받으면 영상 없이 굽는다.
#
# 결과는 주석(annotation)으로 남긴다 — 공개 저장소의 주석은 로그인 없이 읽힌다(Checks API).
name: 새 앱(Expo) 굽기

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'lib/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight 에 올리기 (끄면 굽기 · 검사만)'
        type: boolean
        default: false
      simulator_check:
        description: '시뮬레이터에서 켜 보기 (참고용, 실패해도 멈추지 않음)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: 바닥 판 셈
    concurrency:
      group: ios-native-plan-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    env:
      APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN || secrets.LIBRARY_BUNDLE_TOKEN }}
    outputs:
      runtime: ${{ steps.fp.outputs.runtime }}
      built: ${{ steps.bin.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci --no-audit --no-fund
      # ios/ 가 없는 상태(managed)로 셈해 굽기에 그대로 넘긴다(EXPO_UPDATES_FINGERPRINT_OVERRIDE) — 굽는 맥 · 리눅스가 따로 세면 어긋날 수 있다
      - id: fp
        run: |
          RT=$(npx expo-updates fingerprint:generate --platform ios --workflow managed | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).hash))')
          echo "runtime=$RT" >> "$GITHUB_OUTPUT"
          echo "::notice title=바닥 판::$RT"
      - id: bin
        run: echo "built=$(node scripts/publish-update.mts has-binary --runtime '${{ steps.fp.outputs.runtime }}' | tail -1)" >> "$GITHUB_OUTPUT"

  publish:
    name: 화면 코드 업데이트 올리기
    needs: plan
    if: github.event_name == 'push'
    concurrency:
      group: ios-native-publish-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    env:
      APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN || secrets.LIBRARY_BUNDLE_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/dist"
      - run: node scripts/publish-update.mts publish --dist "$RUNNER_TEMP/dist" --runtime '${{ needs.plan.outputs.runtime }}' --commit '${{ github.sha }}'

  build:
    needs: plan
    # 바닥 판이 새것일 때만(그 판 앱이 TestFlight 에 없다) — 같은 판이면 publish 로 끝난다. 손으로 돌리면 늘 굽는다
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.built != 'true'
    name: 굽기${{ (github.event_name == 'push' || inputs.upload) && ' · TestFlight 올리기' || '' }}
    # 긴 굽기는 뒤 푸시가 와도 멈추지 않는다 — 멈추면 TestFlight 에 영영 못 올라간다. 뒤 것은 앞 굽기가 끝나면 이어서
    concurrency:
      group: ios-native-build-${{ github.ref }}
      cancel-in-progress: false
    # Expo SDK 58 · React Native 0.88 은 Xcode 26 이상 — macos-26 의 기본 Xcode 가 26.x 다
    runs-on: macos-26
    # RN · Hermes 까지 처음부터 컴파일해서 옛 앱보다 오래 걸린다(윤호 맥북 M 시리즈에서 12분, GitHub 맥은 더)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      NO_COLOR: '1'
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      LANG: en_US.UTF-8
      # 앱 안에 적히는 바닥 판 — plan 이 센 값 그대로(업데이트가 같은 판으로 올라간다)
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: 앱 패키지 설치
        id: npm
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/npm.log"

      # 운동 · 드릴 영상(720p HEVC) — 사이트가 굽기 전용 열쇠로 읽기 주소를 준다(npm run library:bundle -- --hevc 가 저장소
      # library-hevc/ 에 올린 것). 다음 prebuild 가 앱에 싣는다. 열쇠가 없거나 못 받으면 영상 없이 굽는다.
      - name: 운동 영상 받기
        env:
          LIBRARY_BUNDLE_TOKEN: ${{ secrets.LIBRARY_BUNDLE_TOKEN }}
        run: node scripts/fetch-library-videos.mjs

      # app.json → ios/ (Xcode 프로젝트 · Info.plist · Podfile). --no-install 로 pod install 은 다음 단계에서 따로 —
      # 어디서 막혔는지 로그가 갈리게.
      - name: iOS 프로젝트 만들기 (expo prebuild)
        id: prebuild
        run: |
          set -o pipefail
          npx expo prebuild -p ios --no-install 2>&1 | tee "$RUNNER_TEMP/prebuild.log"
          test -d ios/BullpenLog.xcodeproj

      - name: CocoaPods 설치
        id: pods
        run: |
          set -o pipefail
          pod --version
          (cd ios && pod install 2>&1) | tee "$RUNNER_TEMP/pods.log"
          test -d ios/BullpenLog.xcworkspace

      # 빌드 번호는 올릴 때마다 커져야 한다(같거나 작으면 애플이 거절한다). 시각으로 만든다 — 20261019.123045(UTC).
      # 옛 앱(ios.yml)과 같은 모양이라 두 워크플로가 번갈아 올려도 겹치지 않는다.
      - name: 빌드 번호 정하기
        id: version
        run: |
          NOW=$(date -u +%Y%m%d%H%M%S)
          BUILD="${NOW:0:8}.$((10#${NOW:8:6}))"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/BullpenLog/Info.plist
          # 다이나믹 아일랜드 휴식 시계 확장(plugins/rest-activity)도 앱과 같은 번호여야 App Store 가 받는다
          EXT=ios/RestActivity/RestActivity-Info.plist
          if [ -f "$EXT" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$EXT"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/BullpenLog/Info.plist)" "$EXT"
          fi
          echo "빌드 번호 $BUILD · 판 $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/BullpenLog/Info.plist)"

      - name: 앱 굽기 — 서명 없이 아카이브
        id: xcodebuild
        env:
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive \
            -workspace ios/BullpenLog.xcworkspace \
            -scheme BullpenLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BullpenLog.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: 만들어진 앱 확인
        id: check
        env:
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          APP="$RUNNER_TEMP/BullpenLog.xcarchive/Products/Applications/BullpenLog.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Info.plist"; }
          test -f "$APP/Assets.car"                          # 아이콘 · 시작 화면
          test -f "$APP/main.jsbundle"                       # Release 는 화면 코드(JS)를 앱 안에 넣는다 — 없으면 켜자마자 빈 화면
          plist NSCameraUsageDescription > /dev/null
          test "$(plist CFBundleIdentifier)" = "com.bullpenlog.app"
          test "$(plist CFBundleVersion)" = "$BUILD"
          MSG="앱이 만들어졌다 — $(plist CFBundleDisplayName) $(plist CFBundleShortVersionString) ($BUILD) · $(plist CFBundleIdentifier) · 최소 iOS $(plist MinimumOSVersion) · $(lipo -archs "$APP/BullpenLog") · $(du -sh "$APP" | cut -f1)"
          echo "::notice title=굽기 성공::$MSG"
          echo "### $MSG" >> "$GITHUB_STEP_SUMMARY"

      # 켜자마자 꺼지는 흔한 까닭 — 실행 파일(과 각 프레임워크)이 찾는 @rpath 부품이 앱 안 Frameworks 폴더에 없는 것.
      - name: 앱 안 부품 확인
        id: frameworks
        run: |
          APP="$RUNNER_TEMP/BullpenLog.xcarchive/Products/Applications/BullpenLog.app"
          FW=$(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ')
          NEED=""
          for bin in "$APP/BullpenLog" "$APP"/Frameworks/*.framework/*; do
            [ -f "$bin" ] && file "$bin" | grep -q 'Mach-O' || continue
            NEED="$NEED $(otool -L "$bin" | awk 'NR>1{print $1}' | grep '^@rpath/' | sed 's#^@rpath/##' | tr '\n' ' ')"
          done
          NEED=$(echo $NEED | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "::notice title=앱 안 부품::Frameworks 폴더: ${FW:-없음} / 실행 파일이 찾는 것: ${NEED:-없음}"
          MISSING=""
          for n in $NEED; do [ -e "$APP/Frameworks/$n" ] || MISSING="$MISSING $n"; done
          if [ -n "$MISSING" ]; then
            echo "::error title=앱 안 부품이 빠졌다::폰에서 켜는 순간 이것을 못 찾아 꺼진다:$MISSING"
            exit 1
          fi

      # 시뮬레이터용으로 한 번 더 굽고(Release — 화면 코드가 앱 안에 든 채) 실제로 켜서 25초 안에 꺼지는지 본다.
      # 참고용 — 올리기를 막지 않는다(continue-on-error). GitHub 맥의 가상 아이폰이 들쭉날쭉해서 막으면 정상 앱도 못 올린다.
      # 옛 앱의 시작 연출 찍어 보기는 안 넣었다(새 앱의 시작 화면은 Expo 의 정지 그림이라 잴 것이 없다).
      - name: 시뮬레이터에서 켜 보기
        id: simlaunch
        if: github.event_name != 'push' && inputs.simulator_check
        continue-on-error: true
        run: |
          set -o pipefail
          trap 'echo "::warning title=시뮬레이터 단계가 멈춘 곳::줄 $LINENO: $(echo "$BASH_COMMAND" | cut -c1-300)"' ERR
          step() { echo "::notice title=시뮬레이터::$1"; }
          if ! xcodebuild build -workspace ios/BullpenLog.xcworkspace -scheme BullpenLog -configuration Release \
               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
               -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/sim-build.log" 2>&1; then
            { grep -E 'error:' "$RUNNER_TEMP/sim-build.log" | awk '!seen[$0]++' | head -n 8 || true; tail -n 3 "$RUNNER_TEMP/sim-build.log"; } \
              | cut -c1-900 | sed 's/%/%25/g; s/^/::warning title=시뮬레이터용 굽기 실패::/'
            exit 1
          fi
          SIMAPP="$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator/BullpenLog.app"
          step "굽기 끝 ($(du -sh "$SIMAPP" | cut -f1))"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))
          ')
          step "기기: $(xcrun simctl list devices | grep "$UDID" | head -n 1 | sed 's/^ *//')"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$SIMAPP"
          step "설치 끝, 켜 본다"
          xcrun simctl launch --console "$UDID" com.bullpenlog.app > "$RUNNER_TEMP/sim-console.log" 2>&1 &
          CONSOLE_PID=$!
          sleep 25
          APP_PID=$(grep -Eo 'com\.bullpenlog\.app: [0-9]+' "$RUNNER_TEMP/sim-console.log" | head -n 1 | awk '{print $2}' || true)
          ALIVE=""
          if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then ALIVE="pid $APP_PID"; fi
          if [ -z "$ALIVE" ] && xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q 'com\.bullpenlog\.app'; then ALIVE="launchctl"; fi
          if [ -n "$ALIVE" ]; then
            kill "$CONSOLE_PID" 2>/dev/null || true
            echo "::notice title=시뮬레이터에서 켜짐::25초 동안 꺼지지 않았다 ($ALIVE)"
            exit 0
          fi
          # 꺼졌다(또는 켜지지 않았다) — 멈추지 말고 까닭을 모은다
          trap - ERR
          set +e +o pipefail
          sleep 5
          REPORT=$(ls -t ~/Library/Logs/DiagnosticReports/BullpenLog-*.ips ~/Library/Logs/DiagnosticReports/*/BullpenLog-*.ips 2>/dev/null | head -n 1)
          xcrun simctl spawn "$UDID" log show --style compact --last 3m \
            --predicate 'process == "BullpenLog" AND (messageType == error OR messageType == fault)' > "$RUNNER_TEMP/sim-log.txt" 2>&1
          {
            echo "켜진 pid: ${APP_PID:-못 찾음} / 충돌 기록: ${REPORT:-없음}"
            [ -n "$REPORT" ] && python3 -c '
          import json, sys
          b = json.loads(open(sys.argv[1], encoding="utf-8", errors="replace").read().partition("\n")[2])
          ex = b.get("exception") or {}
          print("예외:", ex.get("type"), ex.get("signal"), ex.get("subtype") or "")
          t = b.get("termination") or {}
          r = t.get("reasons") or []
          print("종료:", t.get("namespace"), t.get("indicator") or "", " / ".join([r] if isinstance(r, str) else r)[:600])
          ' "$REPORT"
            tail -n 4 "$RUNNER_TEMP/sim-console.log"
            grep -v '^Timestamp' "$RUNNER_TEMP/sim-log.txt" | tail -n 3
          } | tr -d '\r' | head -n 10 | cut -c1-900 | sed 's/%/%25/g; s/^/::warning title=시뮬레이터에서 꺼짐::/'
          exit 1

      # 여기부터는 main 푸시 · Run workflow 에서 '올리기' 스위치를 켠 실행만. 열쇠 넷이 다 있는지 · 모양이 맞는지 본다(ios.yml 과 같다).
      - name: 애플 열쇠 확인
        id: signing
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error title=애플 열쇠가 빠졌다::올리기를 켰는데 GitHub Secrets 에 없는 것:$missing — mobile/APPLE-SETUP.md 5번"
            exit 1
          fi
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ok=1
          printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' \
            || { echo "::error title=ASC_KEY_ID 모양이 틀렸다::키 ID 는 영문 대문자 · 숫자 10자다(발급자 ID 와 바꿔 넣지 않았는지 본다)"; ok=0; }
          printf '%s' "$ISSUER" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || { echo "::error title=ASC_ISSUER_ID 모양이 틀렸다::발급자 ID 는 8-4-4-4-12 모양이다"; ok=0; }
          printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$' \
            || { echo "::error title=APPLE_TEAM_ID 모양이 틀렸다::팀 ID 는 영문 대문자 · 숫자 10자다"; ok=0; }
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY_DIR/AuthKey.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_DIR/AuthKey.p8" || ! openssl pkey -in "$KEY_DIR/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error title=ASC_KEY_P8 내용이 틀렸다::.p8 파일을 메모장으로 열어 -----BEGIN PRIVATE KEY----- 부터 -----END PRIVATE KEY----- 까지 전부 붙여 넣는다"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 배포 도장을 찍어 TestFlight 에 올리기
        id: upload
        if: (github.event_name == 'push' || inputs.upload) && steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BullpenLog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          MSG="TestFlight 에 올렸다 — 새 앱 Bullpen Log ($BUILD). 애플 처리(보통 5~30분)가 끝나면 TestFlight 앱에 뜬다 — 테스터 모두의 앱이 새 앱으로 바뀐다"
          echo "::notice title=TestFlight 올리기 성공::$MSG"
          echo "### $MSG" >> "$GITHUB_STEP_SUMMARY"

      # TestFlight 에 올렸으면 그 바닥 판 앱이 있다고 적는다 — 다음 푸시부터 같은 판이면 굽지 않고 업데이트만 올린다
      - name: 바닥 판 앱을 구웠다고 적기
        if: steps.upload.outcome == 'success'
        env:
          APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN || secrets.LIBRARY_BUNDLE_TOKEN }}
        run: node scripts/publish-update.mts mark-binary --runtime '${{ needs.plan.outputs.runtime }}' --build '${{ steps.version.outputs.build }}'

      - name: 올리기 건너뜀 알림
        if: ${{ github.event_name != 'push' && !inputs.upload }}
        run: echo "::notice title=TestFlight 건너뜀::굽기 · 검사만 했다. 올리려면 Run workflow 에서 'TestFlight 에 올리기'를 켠다(김민이 정한 뒤)"

      - name: 열쇠 파일 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ExportOptions.plist"

      - name: 실패 이유를 주석으로 남기기
        if: failure()
        env:
          NPM: ${{ steps.npm.outcome }}
          PREBUILD: ${{ steps.prebuild.outcome }}
          PODS: ${{ steps.pods.outcome }}
          XCB: ${{ steps.xcodebuild.outcome }}
          CHECK: ${{ steps.check.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          OUT="$RUNNER_TEMP/errors.txt"
          {
            if [ "$NPM" = failure ]; then tail -n 10 "$RUNNER_TEMP/npm.log"; fi
            if [ "$PREBUILD" = failure ]; then tail -n 10 "$RUNNER_TEMP/prebuild.log"; fi
            if [ "$PODS" = failure ]; then grep -Ei 'error|\[!\]' "$RUNNER_TEMP/pods.log" | head -n 8; tail -n 5 "$RUNNER_TEMP/pods.log"; fi
            if [ "$XCB" = failure ]; then
              LOG="$RUNNER_TEMP/xcodebuild.log"
              grep -E 'error:|\*\* (ARCHIVE|BUILD) FAILED' "$LOG" | awk '!seen[$0]++' | head -n 10
              grep -q 'error:' "$LOG" || tail -n 10 "$LOG"
            fi
            if [ "$CHECK" = failure ]; then echo "만들어진 앱에 빠진 것이 있다 — '만들어진 앱 확인' 단계의 test 줄을 본다"; fi
            if [ "$UPLOAD" = failure ]; then
              LOG="$RUNNER_TEMP/export.log"
              grep -Ei 'error|failed|permission|agreement' "$LOG" | awk '!seen[$0]++' | head -n 10
              grep -Eqi 'error|failed' "$LOG" || tail -n 10 "$LOG"
            fi
          } 2>/dev/null | tr -d '\r' > "$OUT" || true
          head -n 10 "$OUT" | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=실패::/'
          { echo '### 실패 — 오류 줄'; echo '```'; cat "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
