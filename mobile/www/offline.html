<!doctype html>
<!--
  사이트를 못 불러왔을 때 앱이 대신 보여 주는 화면 (capacitor.config.json 의 server.errorPath).
  앱은 bullpen-log.vercel.app 을 그대로 여는 껍데기라, 인터넷이 끊기면 이 화면이 뜬다.
  인터넷이 돌아오면 저절로 다시 불러온다.

  밝은 판 하나다 — 로딩 화면(시작 화면)과 앱의 처음 테마가 라이트라서 폰의 다크 모드를 따르면
  밝은 로딩 → 어두운 이 화면으로 번쩍였다. 로고는 components/logo.tsx 의 B(새 로고).
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bullpen Log</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #f4f7fb;
        color: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        text-align: center;
        overscroll-behavior: none;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #56657a;
      }
      button {
        margin-top: 16px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #0297e4;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg height="48" viewBox="0 0 594 613" aria-hidden="true">
      <path
        fill="#0297e4"
        d="M0 0H237V613H0ZM281 0H453A125 141 0 0 1 453 282H281ZM281 329H470A124 142 0 0 1 470 613H281Z"
      />
    </svg>
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>불펜로그를 불러오지 못했어요.<br />연결되면 저절로 다시 열려요.</p>
    <button type="button" id="retry">다시 시도</button>
    <script>
      const START = 'https://bullpen-log.vercel.app/today';
      const retry = () => location.replace(START);
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
      /* 로딩 화면(로고)을 걷는다 — 안 걷으면 4초 동안 이 화면을 덮고 있다 */
      const cap = window.Capacitor;
      if (cap && cap.nativePromise) {
        cap
          .nativePromise('SplashScreen', 'hide', { fadeOutDuration: 250 })
          .catch(() => {});
        cap.nativePromise('SystemBars', 'setStyle', { style: 'LIGHT' }).catch(() => {});
      }
    </script>
  </body>
</html>
